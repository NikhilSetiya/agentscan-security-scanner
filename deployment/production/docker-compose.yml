# Production Docker Compose Configuration for AgentScan Security Scanner\n# This configuration is optimized for production deployment with:\n# - Security hardening\n# - Resource limits\n# - Health checks\n# - Proper networking\n# - Persistent volumes\n# - Monitoring integration\n\nversion: '3.8'\n\nservices:\n  # =============================================================================\n  # Database Services\n  # =============================================================================\n  \n  # PostgreSQL database with production optimizations\n  postgres:\n    image: postgres:15-alpine\n    container_name: agentscan-postgres\n    restart: unless-stopped\n    \n    environment:\n      POSTGRES_DB: ${DB_NAME:-agentscan}\n      POSTGRES_USER: ${DB_USER:-agentscan}\n      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password\n      POSTGRES_INITDB_ARGS: \"--auth-host=scram-sha-256 --auth-local=scram-sha-256\"\n      PGDATA: /var/lib/postgresql/data/pgdata\n    \n    secrets:\n      - postgres_password\n    \n    ports:\n      - \"127.0.0.1:5432:5432\"  # Bind to localhost only\n    \n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n      - ./configs/postgresql.conf:/etc/postgresql/postgresql.conf:ro\n      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro\n    \n    command: [\n      \"postgres\",\n      \"-c\", \"config_file=/etc/postgresql/postgresql.conf\"\n    ]\n    \n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U ${DB_USER:-agentscan} -d ${DB_NAME:-agentscan}\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n      start_period: 30s\n    \n    deploy:\n      resources:\n        limits:\n          memory: 1G\n          cpus: '1.0'\n        reservations:\n          memory: 512M\n          cpus: '0.5'\n    \n    networks:\n      - backend\n    \n    logging:\n      driver: \"json-file\"\n      options:\n        max-size: \"10m\"\n        max-file: \"3\"\n\n  # Redis for job queues and caching with persistence\n  redis:\n    image: redis:7-alpine\n    container_name: agentscan-redis\n    restart: unless-stopped\n    \n    command: [\n      \"redis-server\",\n      \"/etc/redis/redis.conf\",\n      \"--requirepass\", \"${REDIS_PASSWORD}\"\n    ]\n    \n    ports:\n      - \"127.0.0.1:6379:6379\"  # Bind to localhost only\n    \n    volumes:\n      - redis_data:/data\n      - ./configs/redis.conf:/etc/redis/redis.conf:ro\n    \n    environment:\n      - REDIS_PASSWORD=${REDIS_PASSWORD}\n    \n    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"--pass\", \"${REDIS_PASSWORD}\", \"ping\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n      start_period: 10s\n    \n    deploy:\n      resources:\n        limits:\n          memory: 512M\n          cpus: '0.5'\n        reservations:\n          memory: 256M\n          cpus: '0.25'\n    \n    networks:\n      - backend\n    \n    logging:\n      driver: \"json-file\"\n      options:\n        max-size: \"10m\"\n        max-file: \"3\"\n\n  # =============================================================================\n  # Application Services\n  # =============================================================================\n  \n  # AgentScan API server\n  api:\n    build:\n      context: ../../\n      dockerfile: deployment/production/Dockerfile\n      target: api\n      args:\n        - BUILD_VERSION=${BUILD_VERSION:-latest}\n        - BUILD_TIME=${BUILD_TIME}\n    \n    image: agentscan/api:${BUILD_VERSION:-latest}\n    container_name: agentscan-api\n    restart: unless-stopped\n    \n    ports:\n      - \"${API_PORT:-8080}:8080\"\n    \n    environment:\n      # Database configuration\n      - DB_HOST=postgres\n      - DB_PORT=5432\n      - DB_NAME=${DB_NAME:-agentscan}\n      - DB_USER=${DB_USER:-agentscan}\n      - DB_PASSWORD=${DB_PASSWORD}\n      - DB_SSL_MODE=${DB_SSL_MODE:-require}\n      - DB_MAX_CONNECTIONS=${DB_MAX_CONNECTIONS:-25}\n      - DB_MAX_IDLE_CONNECTIONS=${DB_MAX_IDLE_CONNECTIONS:-5}\n      \n      # Redis configuration\n      - REDIS_HOST=redis\n      - REDIS_PORT=6379\n      - REDIS_PASSWORD=${REDIS_PASSWORD}\n      - REDIS_DB=${REDIS_DB:-0}\n      \n      # Authentication\n      - JWT_SECRET=${JWT_SECRET}\n      - JWT_EXPIRY=${JWT_EXPIRY:-24h}\n      - SUPABASE_URL=${SUPABASE_URL}\n      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}\n      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}\n      \n      # GitHub integration\n      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}\n      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}\n      - GITHUB_APP_ID=${GITHUB_APP_ID}\n      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY}\n      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}\n      \n      # Application settings\n      - APP_ENV=production\n      - LOG_LEVEL=${LOG_LEVEL:-info}\n      - LOG_FORMAT=${LOG_FORMAT:-json}\n      - CORS_ORIGINS=${CORS_ORIGINS:-https://app.agentscan.io}\n      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}\n      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}\n      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-1m}\n      \n      # Monitoring\n      - METRICS_ENABLED=${METRICS_ENABLED:-true}\n      - TRACING_ENABLED=${TRACING_ENABLED:-true}\n      - HEALTH_CHECK_ENABLED=${HEALTH_CHECK_ENABLED:-true}\n      \n      # Observe MCP integration\n      - OBSERVE_CUSTOMER=${OBSERVE_CUSTOMER}\n      - OBSERVE_TOKEN=${OBSERVE_TOKEN}\n      - OBSERVE_COLLECT_URL=${OBSERVE_COLLECT_URL}\n    \n    depends_on:\n      postgres:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n    \n    volumes:\n      - api_logs:/var/log/agentscan\n      - api_temp:/tmp/agentscan\n    \n    deploy:\n      resources:\n        limits:\n          memory: 1G\n          cpus: '1.0'\n        reservations:\n          memory: 512M\n          cpus: '0.5'\n      \n      restart_policy:\n        condition: on-failure\n        delay: 5s\n        max_attempts: 3\n        window: 120s\n    \n    networks:\n      - frontend\n      - backend\n    \n    logging:\n      driver: \"json-file\"\n      options:\n        max-size: \"10m\"\n        max-file: \"5\"\n    \n    labels:\n      - \"com.agentscan.service=api\"\n      - \"com.agentscan.version=${BUILD_VERSION:-latest}\"\n\n  # AgentScan orchestrator\n  orchestrator:\n    build:\n      context: ../../\n      dockerfile: deployment/production/Dockerfile\n      target: orchestrator\n      args:\n        - BUILD_VERSION=${BUILD_VERSION:-latest}\n        - BUILD_TIME=${BUILD_TIME}\n    \n    image: agentscan/orchestrator:${BUILD_VERSION:-latest}\n    container_name: agentscan-orchestrator\n    restart: unless-stopped\n    \n    environment:\n      # Database configuration\n      - DB_HOST=postgres\n      - DB_PORT=5432\n      - DB_NAME=${DB_NAME:-agentscan}\n      - DB_USER=${DB_USER:-agentscan}\n      - DB_PASSWORD=${DB_PASSWORD}\n      - DB_SSL_MODE=${DB_SSL_MODE:-require}\n      \n      # Redis configuration\n      - REDIS_HOST=redis\n      - REDIS_PORT=6379\n      - REDIS_PASSWORD=${REDIS_PASSWORD}\n      - REDIS_DB=${REDIS_DB:-0}\n      \n      # Orchestrator settings\n      - AGENTS_MAX_CONCURRENT=${AGENTS_MAX_CONCURRENT:-10}\n      - AGENTS_DEFAULT_TIMEOUT=${AGENTS_DEFAULT_TIMEOUT:-15m}\n      - AGENTS_RETRY_ATTEMPTS=${AGENTS_RETRY_ATTEMPTS:-3}\n      - AGENTS_RETRY_DELAY=${AGENTS_RETRY_DELAY:-30s}\n      - QUEUE_POLL_INTERVAL=${QUEUE_POLL_INTERVAL:-5s}\n      - QUEUE_BATCH_SIZE=${QUEUE_BATCH_SIZE:-5}\n      \n      # Docker configuration\n      - DOCKER_HOST=unix:///var/run/docker.sock\n      - DOCKER_API_VERSION=1.41\n      \n      # Application settings\n      - APP_ENV=production\n      - LOG_LEVEL=${LOG_LEVEL:-info}\n      - LOG_FORMAT=${LOG_FORMAT:-json}\n      \n      # Monitoring\n      - METRICS_ENABLED=${METRICS_ENABLED:-true}\n      - TRACING_ENABLED=${TRACING_ENABLED:-true}\n      - HEALTH_CHECK_ENABLED=${HEALTH_CHECK_ENABLED:-true}\n      \n      # Observe MCP integration\n      - OBSERVE_CUSTOMER=${OBSERVE_CUSTOMER}\n      - OBSERVE_TOKEN=${OBSERVE_TOKEN}\n      - OBSERVE_COLLECT_URL=${OBSERVE_COLLECT_URL}\n    \n    depends_on:\n      postgres:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n    \n    volumes:\n      - /var/run/docker.sock:/var/run/docker.sock:ro\n      - orchestrator_logs:/var/log/agentscan\n      - orchestrator_temp:/tmp/agentscan\n      - agent_cache:/home/agentscan/.cache\n    \n    deploy:\n      resources:\n        limits:\n          memory: 2G\n          cpus: '2.0'\n        reservations:\n          memory: 1G\n          cpus: '1.0'\n      \n      restart_policy:\n        condition: on-failure\n        delay: 10s\n        max_attempts: 3\n        window: 120s\n    \n    networks:\n      - backend\n    \n    logging:\n      driver: \"json-file\"\n      options:\n        max-size: \"10m\"\n        max-file: \"5\"\n    \n    labels:\n      - \"com.agentscan.service=orchestrator\"\n      - \"com.agentscan.version=${BUILD_VERSION:-latest}\"\n\n  # =============================================================================\n  # Monitoring and Observability\n  # =============================================================================\n  \n  # Prometheus for metrics collection\n  prometheus:\n    image: prom/prometheus:v2.45.0\n    container_name: agentscan-prometheus\n    restart: unless-stopped\n    \n    command:\n      - '--config.file=/etc/prometheus/prometheus.yml'\n      - '--storage.tsdb.path=/prometheus'\n      - '--web.console.libraries=/etc/prometheus/console_libraries'\n      - '--web.console.templates=/etc/prometheus/consoles'\n      - '--storage.tsdb.retention.time=15d'\n      - '--web.enable-lifecycle'\n      - '--web.enable-admin-api'\n    \n    ports:\n      - \"127.0.0.1:9090:9090\"\n    \n    volumes:\n      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro\n      - prometheus_data:/prometheus\n    \n    networks:\n      - monitoring\n      - backend\n    \n    deploy:\n      resources:\n        limits:\n          memory: 512M\n          cpus: '0.5'\n        reservations:\n          memory: 256M\n          cpus: '0.25'\n\n  # Grafana for visualization\n  grafana:\n    image: grafana/grafana:10.0.0\n    container_name: agentscan-grafana\n    restart: unless-stopped\n    \n    environment:\n      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}\n      - GF_USERS_ALLOW_SIGN_UP=false\n      - GF_INSTALL_PLUGINS=grafana-piechart-panel\n    \n    ports:\n      - \"127.0.0.1:3001:3000\"\n    \n    volumes:\n      - grafana_data:/var/lib/grafana\n      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro\n      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro\n    \n    networks:\n      - monitoring\n    \n    deploy:\n      resources:\n        limits:\n          memory: 256M\n          cpus: '0.25'\n        reservations:\n          memory: 128M\n          cpus: '0.1'\n\n# =============================================================================\n# Networks\n# =============================================================================\nnetworks:\n  frontend:\n    driver: bridge\n    name: agentscan-frontend\n  \n  backend:\n    driver: bridge\n    name: agentscan-backend\n    internal: true  # No external access\n  \n  monitoring:\n    driver: bridge\n    name: agentscan-monitoring\n    internal: true  # No external access\n\n# =============================================================================\n# Volumes\n# =============================================================================\nvolumes:\n  # Database volumes\n  postgres_data:\n    driver: local\n    name: agentscan-postgres-data\n  \n  redis_data:\n    driver: local\n    name: agentscan-redis-data\n  \n  # Application volumes\n  api_logs:\n    driver: local\n    name: agentscan-api-logs\n  \n  api_temp:\n    driver: local\n    name: agentscan-api-temp\n  \n  orchestrator_logs:\n    driver: local\n    name: agentscan-orchestrator-logs\n  \n  orchestrator_temp:\n    driver: local\n    name: agentscan-orchestrator-temp\n  \n  agent_cache:\n    driver: local\n    name: agentscan-agent-cache\n  \n  # Monitoring volumes\n  prometheus_data:\n    driver: local\n    name: agentscan-prometheus-data\n  \n  grafana_data:\n    driver: local\n    name: agentscan-grafana-data\n\n# =============================================================================\n# Secrets\n# =============================================================================\nsecrets:\n  postgres_password:\n    file: ./secrets/postgres_password.txt\n  \n  jwt_secret:\n    file: ./secrets/jwt_secret.txt\n  \n  github_private_key:\n    file: ./secrets/github_private_key.pem"