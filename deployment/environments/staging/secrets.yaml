# Staging Secrets Configuration for AgentScan\n# This file defines secret references for staging environment\n# Uses separate Supabase project/vault for isolation\n\napiVersion: v1\nkind: Secret\nmetadata:\n  name: agentscan-secrets\n  namespace: agentscan-staging\n  labels:\n    app: agentscan\n    environment: staging\n  annotations:\n    supabase.io/vault-managed: \"true\"\n    supabase.io/vault-project: \"${SUPABASE_STAGING_PROJECT_ID}\"\ntype: Opaque\n\n# Secret references - actual values stored in Supabase Vault (staging)\ndata:\n  # Database secrets (staging database)\n  DB_HOST: \"${vault:database/host}\"\n  DB_NAME: \"${vault:database/name}\"\n  DB_USER: \"${vault:database/user}\"\n  DB_PASSWORD: \"${vault:database/password}\"\n  \n  # Redis secrets (staging Redis)\n  REDIS_HOST: \"${vault:redis/host}\"\n  REDIS_PASSWORD: \"${vault:redis/password}\"\n  \n  # Supabase secrets (staging project)\n  SUPABASE_URL: \"${vault:supabase/url}\"\n  SUPABASE_ANON_KEY: \"${vault:supabase/anon_key}\"\n  SUPABASE_SERVICE_ROLE_KEY: \"${vault:supabase/service_role_key}\"\n  JWT_SECRET: \"${vault:supabase/jwt_secret}\"\n  \n  # GitHub OAuth secrets (staging app)\n  GITHUB_CLIENT_ID: \"${vault:github/client_id}\"\n  GITHUB_SECRET: \"${vault:github/client_secret}\"\n  \n  # SMTP secrets (staging SMTP)\n  SMTP_HOST: \"${vault:smtp/host}\"\n  SMTP_USER: \"${vault:smtp/user}\"\n  SMTP_PASSWORD: \"${vault:smtp/password}\"\n  \n  # Webhook secrets (staging webhooks)\n  SLACK_WEBHOOK_URL: \"${vault:notifications/slack_webhook}\"\n  WEBHOOK_URL: \"${vault:notifications/webhook_url}\"\n  WEBHOOK_SECRET: \"${vault:notifications/webhook_secret}\"\n  \n  # API Keys for external services (staging/test keys)\n  GITHUB_TOKEN: \"${vault:integrations/github_token}\"\n  DOCKER_REGISTRY_TOKEN: \"${vault:integrations/docker_registry_token}\"\n  \n  # Encryption keys (staging keys)\n  ENCRYPTION_KEY: \"${vault:security/encryption_key}\"\n  SIGNING_KEY: \"${vault:security/signing_key}\"\n  \n  # Monitoring secrets (staging monitoring)\n  PROMETHEUS_PASSWORD: \"${vault:monitoring/prometheus_password}\"\n  GRAFANA_ADMIN_PASSWORD: \"${vault:monitoring/grafana_admin_password}\"\n  \n---\n# TLS certificate for staging\napiVersion: v1\nkind: Secret\nmetadata:\n  name: agentscan-tls\n  namespace: agentscan-staging\n  labels:\n    app: agentscan\n    environment: staging\ntype: kubernetes.io/tls\ndata:\n  tls.crt: \"${vault:tls/certificate}\"\n  tls.key: \"${vault:tls/private_key}\"\n  \n---\n# Docker registry secret for staging\napiVersion: v1\nkind: Secret\nmetadata:\n  name: agentscan-registry\n  namespace: agentscan-staging\n  labels:\n    app: agentscan\n    environment: staging\ntype: kubernetes.io/dockerconfigjson\ndata:\n  .dockerconfigjson: \"${vault:docker/config_json}\"\n"