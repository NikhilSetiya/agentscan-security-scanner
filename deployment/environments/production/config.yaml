# Production Environment Configuration for AgentScan\n# This file contains production-specific settings and should be kept secure\n\n# Application Configuration\napp:\n  name: \"agentscan\"\n  environment: \"production\"\n  version: \"1.0.0\"\n  debug: false\n  log_level: \"info\"\n  \n# Server Configuration\nserver:\n  host: \"0.0.0.0\"\n  port: 8080\n  read_timeout: \"30s\"\n  write_timeout: \"30s\"\n  idle_timeout: \"120s\"\n  shutdown_timeout: \"30s\"\n  \n# Database Configuration\ndatabase:\n  host: \"${DB_HOST}\"\n  port: 5432\n  name: \"${DB_NAME}\"\n  user: \"${DB_USER}\"\n  password: \"${DB_PASSWORD}\"\n  ssl_mode: \"require\"\n  max_open_conns: 25\n  max_idle_conns: 5\n  conn_max_lifetime: \"5m\"\n  \n# Redis Configuration\nredis:\n  host: \"${REDIS_HOST}\"\n  port: 6379\n  password: \"${REDIS_PASSWORD}\"\n  db: 0\n  max_retries: 3\n  pool_size: 10\n  \n# Supabase Configuration\nsupabase:\n  url: \"${SUPABASE_URL}\"\n  anon_key: \"${SUPABASE_ANON_KEY}\"\n  service_role_key: \"${SUPABASE_SERVICE_ROLE_KEY}\"\n  jwt_secret: \"${JWT_SECRET}\"\n  \n# GitHub OAuth Configuration\ngithub:\n  client_id: \"${GITHUB_CLIENT_ID}\"\n  client_secret: \"${GITHUB_SECRET}\"\n  redirect_url: \"https://agentscan.dev/auth/callback\"\n  \n# Security Configuration\nsecurity:\n  cors:\n    allowed_origins:\n      - \"https://agentscan.dev\"\n      - \"https://app.agentscan.dev\"\n      - \"https://api.agentscan.dev\"\n    allowed_methods:\n      - \"GET\"\n      - \"POST\"\n      - \"PUT\"\n      - \"DELETE\"\n      - \"OPTIONS\"\n    allowed_headers:\n      - \"Content-Type\"\n      - \"Authorization\"\n      - \"X-Requested-With\"\n    allow_credentials: true\n    max_age: 86400\n  \n  rate_limiting:\n    enabled: true\n    requests_per_minute: 100\n    burst_size: 20\n    \n  headers:\n    x_frame_options: \"DENY\"\n    x_content_type_options: \"nosniff\"\n    x_xss_protection: \"1; mode=block\"\n    strict_transport_security: \"max-age=31536000; includeSubDomains\"\n    content_security_policy: \"default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'\"\n    \n# Agent Configuration\nagents:\n  max_concurrent: 5\n  default_timeout: \"10m\"\n  scan_timeout: \"30m\"\n  \n  # Available agents\n  available:\n    - name: \"semgrep\"\n      enabled: true\n      timeout: \"5m\"\n    - name: \"bandit\"\n      enabled: true\n      timeout: \"3m\"\n    - name: \"eslint-security\"\n      enabled: true\n      timeout: \"2m\"\n    - name: \"npm-audit\"\n      enabled: true\n      timeout: \"3m\"\n    - name: \"pip-audit\"\n      enabled: true\n      timeout: \"3m\"\n    - name: \"govulncheck\"\n      enabled: true\n      timeout: \"5m\"\n    - name: \"trufflehog\"\n      enabled: true\n      timeout: \"10m\"\n    - name: \"git-secrets\"\n      enabled: true\n      timeout: \"2m\"\n    - name: \"zap\"\n      enabled: false  # Disabled in production by default\n      timeout: \"15m\"\n      \n# Monitoring Configuration\nmonitoring:\n  metrics:\n    enabled: true\n    port: 9090\n    path: \"/metrics\"\n    \n  health_checks:\n    enabled: true\n    interval: \"30s\"\n    timeout: \"10s\"\n    \n  logging:\n    format: \"json\"\n    level: \"info\"\n    output: \"stdout\"\n    \n# Storage Configuration\nstorage:\n  scan_results:\n    retention_days: 90\n    cleanup_interval: \"24h\"\n    \n  logs:\n    retention_days: 30\n    max_size_mb: 100\n    \n# Notification Configuration\nnotifications:\n  email:\n    enabled: true\n    smtp_host: \"${SMTP_HOST}\"\n    smtp_port: 587\n    smtp_user: \"${SMTP_USER}\"\n    smtp_password: \"${SMTP_PASSWORD}\"\n    from_address: \"noreply@agentscan.dev\"\n    \n  slack:\n    enabled: false\n    webhook_url: \"${SLACK_WEBHOOK_URL}\"\n    \n  webhook:\n    enabled: false\n    url: \"${WEBHOOK_URL}\"\n    secret: \"${WEBHOOK_SECRET}\"\n    \n# Feature Flags\nfeatures:\n  real_time_updates: true\n  advanced_analytics: true\n  api_rate_limiting: true\n  audit_logging: true\n  multi_tenant: false\n  \n# Performance Configuration\nperformance:\n  cache:\n    enabled: true\n    ttl: \"1h\"\n    max_size: 1000\n    \n  compression:\n    enabled: true\n    level: 6\n    \n  pagination:\n    default_limit: 50\n    max_limit: 1000\n"