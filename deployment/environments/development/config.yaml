# Development Environment Configuration for AgentScan\n# This file contains development-specific settings for local development\n\n# Application Configuration\napp:\n  name: \"agentscan-dev\"\n  environment: \"development\"\n  version: \"dev\"\n  debug: true\n  log_level: \"debug\"\n  \n# Server Configuration\nserver:\n  host: \"localhost\"\n  port: 8080\n  read_timeout: \"30s\"\n  write_timeout: \"30s\"\n  idle_timeout: \"120s\"\n  shutdown_timeout: \"10s\"\n  \n# Database Configuration\ndatabase:\n  host: \"localhost\"\n  port: 5432\n  name: \"agentscan_dev\"\n  user: \"postgres\"\n  password: \"postgres\"\n  ssl_mode: \"disable\"\n  max_open_conns: 5\n  max_idle_conns: 2\n  conn_max_lifetime: \"5m\"\n  \n# Redis Configuration\nredis:\n  host: \"localhost\"\n  port: 6379\n  password: \"\"\n  db: 0\n  max_retries: 3\n  pool_size: 5\n  \n# Supabase Configuration (optional for local dev)\nsupabase:\n  url: \"${SUPABASE_URL:-http://localhost:54321}\"\n  anon_key: \"${SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}\"\n  service_role_key: \"${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}\"\n  jwt_secret: \"${JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters-long}\"\n  \n# GitHub OAuth Configuration (use test app)\ngithub:\n  client_id: \"${GITHUB_CLIENT_ID:-Ov23liQqGitHubTestApp}\"\n  client_secret: \"${GITHUB_SECRET:-test_secret_for_development}\"\n  redirect_url: \"http://localhost:3000/auth/callback\"\n  \n# Security Configuration (relaxed for development)\nsecurity:\n  cors:\n    allowed_origins:\n      - \"http://localhost:3000\"\n      - \"http://localhost:8080\"\n      - \"http://127.0.0.1:3000\"\n      - \"http://127.0.0.1:8080\"\n    allowed_methods:\n      - \"GET\"\n      - \"POST\"\n      - \"PUT\"\n      - \"DELETE\"\n      - \"OPTIONS\"\n      - \"PATCH\"\n    allowed_headers:\n      - \"*\"\n    allow_credentials: true\n    max_age: 86400\n  \n  rate_limiting:\n    enabled: false  # Disabled for development\n    requests_per_minute: 1000\n    burst_size: 100\n    \n  headers:\n    x_frame_options: \"SAMEORIGIN\"\n    x_content_type_options: \"nosniff\"\n    x_xss_protection: \"0\"  # Disabled for development\n    strict_transport_security: \"\"  # No HTTPS in dev\n    content_security_policy: \"default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'\"\n    \n# Agent Configuration\nagents:\n  max_concurrent: 2  # Lower for local resources\n  default_timeout: \"2m\"  # Shorter for faster development\n  scan_timeout: \"5m\"\n  \n  # Available agents (minimal set for development)\n  available:\n    - name: \"semgrep\"\n      enabled: true\n      timeout: \"1m\"\n    - name: \"bandit\"\n      enabled: true\n      timeout: \"30s\"\n    - name: \"eslint-security\"\n      enabled: true\n      timeout: \"30s\"\n    - name: \"npm-audit\"\n      enabled: false  # Can be slow, disabled by default\n      timeout: \"1m\"\n    - name: \"pip-audit\"\n      enabled: false  # Can be slow, disabled by default\n      timeout: \"1m\"\n    - name: \"govulncheck\"\n      enabled: false  # Requires Go, disabled by default\n      timeout: \"1m\"\n    - name: \"trufflehog\"\n      enabled: true\n      timeout: \"1m\"\n    - name: \"git-secrets\"\n      enabled: true\n      timeout: \"30s\"\n    - name: \"zap\"\n      enabled: false  # Heavy tool, disabled by default\n      timeout: \"2m\"\n      \n# Monitoring Configuration\nmonitoring:\n  metrics:\n    enabled: true\n    port: 9090\n    path: \"/metrics\"\n    \n  health_checks:\n    enabled: true\n    interval: \"10s\"\n    timeout: \"3s\"\n    \n  logging:\n    format: \"text\"  # More readable for development\n    level: \"debug\"\n    output: \"stdout\"\n    \n# Storage Configuration\nstorage:\n  scan_results:\n    retention_days: 7  # Short retention for development\n    cleanup_interval: \"1h\"\n    \n  logs:\n    retention_days: 1\n    max_size_mb: 10\n    \n# Notification Configuration (mostly disabled)\nnotifications:\n  email:\n    enabled: false\n    smtp_host: \"localhost\"\n    smtp_port: 1025  # MailHog default port\n    smtp_user: \"\"\n    smtp_password: \"\"\n    from_address: \"dev@agentscan.local\"\n    \n  slack:\n    enabled: false\n    webhook_url: \"${SLACK_WEBHOOK_URL:-}\"\n    \n  webhook:\n    enabled: false\n    url: \"${WEBHOOK_URL:-http://localhost:8081/webhook}\"\n    secret: \"${WEBHOOK_SECRET:-dev-secret}\"\n    \n# Feature Flags (all enabled for testing)\nfeatures:\n  real_time_updates: true\n  advanced_analytics: true\n  api_rate_limiting: false\n  audit_logging: true\n  multi_tenant: true\n  \n# Performance Configuration\nperformance:\n  cache:\n    enabled: false  # Disabled for development to see changes immediately\n    ttl: \"5m\"\n    max_size: 100\n    \n  compression:\n    enabled: false  # Disabled for easier debugging\n    level: 1\n    \n  pagination:\n    default_limit: 10\n    max_limit: 100\n"