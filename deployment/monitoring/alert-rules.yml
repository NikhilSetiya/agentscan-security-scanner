# Prometheus Alert Rules for AgentScan\n# These rules define when alerts should be triggered\n\ngroups:\n  - name: agentscan.rules\n    rules:\n      # Service Health Alerts\n      - alert: AgentScanAPIDown\n        expr: up{job=\"agentscan-api\"} == 0\n        for: 1m\n        labels:\n          severity: critical\n          service: api\n        annotations:\n          summary: \"AgentScan API is down\"\n          description: \"AgentScan API has been down for more than 1 minute.\"\n          runbook_url: \"https://docs.agentscan.dev/runbooks/api-down\"\n\n      - alert: AgentScanOrchestratorDown\n        expr: up{job=\"agentscan-orchestrator\"} == 0\n        for: 1m\n        labels:\n          severity: critical\n          service: orchestrator\n        annotations:\n          summary: \"AgentScan Orchestrator is down\"\n          description: \"AgentScan Orchestrator has been down for more than 1 minute.\"\n          runbook_url: \"https://docs.agentscan.dev/runbooks/orchestrator-down\"\n\n      # Database Alerts\n      - alert: DatabaseDown\n        expr: up{job=\"postgresql\"} == 0\n        for: 30s\n        labels:\n          severity: critical\n          service: database\n        annotations:\n          summary: \"PostgreSQL database is down\"\n          description: \"PostgreSQL database has been down for more than 30 seconds.\"\n          runbook_url: \"https://docs.agentscan.dev/runbooks/database-down\"\n\n      - alert: DatabaseHighConnections\n        expr: pg_stat_database_numbackends / pg_settings_max_connections * 100 > 80\n        for: 5m\n        labels:\n          severity: warning\n          service: database\n        annotations:\n          summary: \"High database connection usage\"\n          description: \"Database connection usage is above 80% ({{ $value }}%)\"\n          runbook_url: \"https://docs.agentscan.dev/runbooks/database-connections\"\n\n      - alert: DatabaseSlowQueries\n        expr: rate(pg_stat_database_tup_returned[5m]) / rate(pg_stat_database_tup_fetched[5m]) < 0.1\n        for: 10m\n        labels:\n          severity: warning\n          service: database\n        annotations:\n          summary: \"Database queries are running slowly\"\n          description: \"Database query efficiency is below 10%\"\n          runbook_url: \"https://docs.agentscan.dev/runbooks/slow-queries\"\n\n      # Redis Alerts\n      - alert: RedisDown\n        expr: up{job=\"redis\"} == 0\n        for: 1m\n        labels:\n          severity: warning\n          service: redis\n        annotations:\n          summary: \"Redis is down\"\n          description: \"Redis has been down for more than 1 minute.\"\n          runbook_url: \"https://docs.agentscan.dev/runbooks/redis-down\"\n\n      - alert: RedisHighMemoryUsage\n        expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 90\n        for: 5m\n        labels:\n          severity: warning\n          service: redis\n        annotations:\n          summary: \"Redis memory usage is high\"\n          description: \"Redis memory usage is above 90% ({{ $value }}%)\"\n          runbook_url: \"https://docs.agentscan.dev/runbooks/redis-memory\"\n\n      # Application Performance Alerts\n      - alert: HighResponseTime\n        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2\n        for: 5m\n        labels:\n          severity: warning\n          service: api\n        annotations:\n          summary: \"High API response time\"\n          description: \"95th percentile response time is above 2 seconds ({{ $value }}s)\"\n          runbook_url: \"https://docs.agentscan.dev/runbooks/high-response-time\"\n\n      - alert: HighErrorRate\n        expr: rate(http_requests_total{status=~\"5..\"}[5m]) / rate(http_requests_total[5m]) * 100 > 5\n        for: 5m\n        labels:\n          severity: warning\n          service: api\n        annotations:\n          summary: \"High API error rate\"\n          description: \"API error rate is above 5% ({{ $value }}%)\"\n          runbook_url: \"https://docs.agentscan.dev/runbooks/high-error-rate\"\n\n      - alert: LowThroughput\n        expr: rate(http_requests_total[5m]) < 1\n        for: 10m\n        labels:\n          severity: info\n          service: api\n        annotations:\n          summary: \"Low API throughput\"\n          description: \"API throughput is below 1 request per second ({{ $value }} req/s)\"\n          runbook_url: \"https://docs.agentscan.dev/runbooks/low-throughput\"\n\n      # System Resource Alerts\n      - alert: HighCPUUsage\n        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100) > 80\n        for: 5m\n        labels:\n          severity: warning\n          service: system\n        annotations:\n          summary: \"High CPU usage\"\n          description: \"CPU usage is above 80% on {{ $labels.instance }} ({{ $value }}%)\"\n          runbook_url: \"https://docs.agentscan.dev/runbooks/high-cpu\"\n\n      - alert: HighMemoryUsage\n        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85\n        for: 5m\n        labels:\n          severity: warning\n          service: system\n        annotations:\n          summary: \"High memory usage\"\n          description: \"Memory usage is above 85% on {{ $labels.instance }} ({{ $value }}%)\"\n          runbook_url: \"https://docs.agentscan.dev/runbooks/high-memory\"\n\n      - alert: LowDiskSpace\n        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 85\n        for: 5m\n        labels:\n          severity: warning\n          service: system\n        annotations:\n          summary: \"Low disk space\"\n          description: \"Disk usage is above 85% on {{ $labels.instance }} ({{ $value }}%)\"\n          runbook_url: \"https://docs.agentscan.dev/runbooks/low-disk-space\"\n\n      # Application-Specific Alerts\n      - alert: FailedScansHigh\n        expr: increase(agentscan_scans_total{status=\"failed\"}[1h]) > 10\n        for: 0m\n        labels:\n          severity: warning\n          service: orchestrator\n        annotations:\n          summary: \"High number of failed scans\"\n          description: \"More than 10 scans have failed in the last hour ({{ $value }})\"\n          runbook_url: \"https://docs.agentscan.dev/runbooks/failed-scans\"\n\n      - alert: ScanQueueBacklog\n        expr: agentscan_scan_queue_size > 50\n        for: 10m\n        labels:\n          severity: warning\n          service: orchestrator\n        annotations:\n          summary: \"Scan queue backlog is high\"\n          description: \"Scan queue has more than 50 pending scans ({{ $value }})\"\n          runbook_url: \"https://docs.agentscan.dev/runbooks/scan-backlog\"\n\n      - alert: LongRunningScan\n        expr: agentscan_scan_duration_seconds > 3600\n        for: 0m\n        labels:\n          severity: info\n          service: orchestrator\n        annotations:\n          summary: \"Long running scan detected\"\n          description: \"Scan {{ $labels.scan_id }} has been running for more than 1 hour ({{ $value }}s)\"\n          runbook_url: \"https://docs.agentscan.dev/runbooks/long-running-scan\"\n\n      # Security Alerts\n      - alert: UnauthorizedAccess\n        expr: increase(http_requests_total{status=\"401\"}[5m]) > 20\n        for: 0m\n        labels:\n          severity: warning\n          service: security\n        annotations:\n          summary: \"High number of unauthorized access attempts\"\n          description: \"More than 20 unauthorized access attempts in 5 minutes\"\n          runbook_url: \"https://docs.agentscan.dev/runbooks/unauthorized-access\"\n\n      - alert: RateLimitExceeded\n        expr: increase(http_requests_total{status=\"429\"}[5m]) > 100\n        for: 0m\n        labels:\n          severity: info\n          service: security\n        annotations:\n          summary: \"Rate limit exceeded frequently\"\n          description: \"Rate limit has been exceeded more than 100 times in 5 minutes\"\n          runbook_url: \"https://docs.agentscan.dev/runbooks/rate-limit\"\n\n  - name: agentscan.recording\n    rules:\n      # Recording rules for commonly used queries\n      - record: agentscan:request_rate_5m\n        expr: rate(http_requests_total[5m])\n\n      - record: agentscan:error_rate_5m\n        expr: rate(http_requests_total{status=~\"5..\"}[5m]) / rate(http_requests_total[5m])\n\n      - record: agentscan:response_time_95p_5m\n        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))\n\n      - record: agentscan:scan_success_rate_1h\n        expr: rate(agentscan_scans_total{status=\"completed\"}[1h]) / rate(agentscan_scans_total[1h])\n\n      - record: agentscan:active_users_5m\n        expr: count(increase(http_requests_total{endpoint=~\"/api/.*\"}[5m]) > 0) by (user_id)\n"