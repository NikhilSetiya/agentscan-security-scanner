# Prometheus Configuration for AgentScan\n# This configuration sets up monitoring for all AgentScan services\n\nglobal:\n  scrape_interval: 15s\n  evaluation_interval: 15s\n  external_labels:\n    cluster: 'agentscan-production'\n    environment: 'production'\n\n# Alertmanager configuration\nalerting:\n  alertmanagers:\n    - static_configs:\n        - targets:\n          - alertmanager:9093\n\n# Load rules once and periodically evaluate them\nrule_files:\n  - \"alert_rules.yml\"\n  - \"recording_rules.yml\"\n\n# Scrape configurations\nscrape_configs:\n  # AgentScan API Server\n  - job_name: 'agentscan-api'\n    static_configs:\n      - targets: ['agentscan-api:8080']\n    metrics_path: '/metrics'\n    scrape_interval: 30s\n    scrape_timeout: 10s\n    honor_labels: true\n    params:\n      format: ['prometheus']\n    relabel_configs:\n      - source_labels: [__address__]\n        target_label: __param_target\n      - source_labels: [__param_target]\n        target_label: instance\n      - target_label: __address__\n        replacement: agentscan-api:8080\n      - target_label: service\n        replacement: api\n\n  # AgentScan Orchestrator\n  - job_name: 'agentscan-orchestrator'\n    static_configs:\n      - targets: ['agentscan-orchestrator:8081']\n    metrics_path: '/metrics'\n    scrape_interval: 30s\n    scrape_timeout: 10s\n    honor_labels: true\n    params:\n      format: ['prometheus']\n    relabel_configs:\n      - target_label: service\n        replacement: orchestrator\n\n  # PostgreSQL Database\n  - job_name: 'postgresql'\n    static_configs:\n      - targets: ['postgres-exporter:9187']\n    scrape_interval: 30s\n    scrape_timeout: 10s\n    relabel_configs:\n      - target_label: service\n        replacement: postgresql\n\n  # Redis\n  - job_name: 'redis'\n    static_configs:\n      - targets: ['redis-exporter:9121']\n    scrape_interval: 30s\n    scrape_timeout: 10s\n    relabel_configs:\n      - target_label: service\n        replacement: redis\n\n  # Node Exporter (System Metrics)\n  - job_name: 'node-exporter'\n    static_configs:\n      - targets: ['node-exporter:9100']\n    scrape_interval: 30s\n    scrape_timeout: 10s\n    relabel_configs:\n      - target_label: service\n        replacement: system\n\n  # Kubernetes Metrics\n  - job_name: 'kubernetes-apiservers'\n    kubernetes_sd_configs:\n      - role: endpoints\n    scheme: https\n    tls_config:\n      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n    relabel_configs:\n      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]\n        action: keep\n        regex: default;kubernetes;https\n\n  - job_name: 'kubernetes-nodes'\n    kubernetes_sd_configs:\n      - role: node\n    scheme: https\n    tls_config:\n      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n    relabel_configs:\n      - action: labelmap\n        regex: __meta_kubernetes_node_label_(.+)\n      - target_label: __address__\n        replacement: kubernetes.default.svc:443\n      - source_labels: [__meta_kubernetes_node_name]\n        regex: (.+)\n        target_label: __metrics_path__\n        replacement: /api/v1/nodes/${1}/proxy/metrics\n\n  - job_name: 'kubernetes-pods'\n    kubernetes_sd_configs:\n      - role: pod\n    relabel_configs:\n      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]\n        action: keep\n        regex: true\n      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]\n        action: replace\n        target_label: __metrics_path__\n        regex: (.+)\n      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]\n        action: replace\n        regex: ([^:]+)(?::\\d+)?;(\\d+)\n        replacement: $1:$2\n        target_label: __address__\n      - action: labelmap\n        regex: __meta_kubernetes_pod_label_(.+)\n      - source_labels: [__meta_kubernetes_namespace]\n        action: replace\n        target_label: kubernetes_namespace\n      - source_labels: [__meta_kubernetes_pod_name]\n        action: replace\n        target_label: kubernetes_pod_name\n\n  # AgentScan Custom Metrics\n  - job_name: 'agentscan-custom'\n    static_configs:\n      - targets: ['agentscan-api:8080']\n    metrics_path: '/stats'\n    scrape_interval: 60s\n    scrape_timeout: 15s\n    params:\n      format: ['json']\n    metric_relabel_configs:\n      - source_labels: [__name__]\n        regex: 'agentscan_(.+)'\n        target_label: __name__\n        replacement: '${1}'\n      - target_label: application\n        replacement: agentscan\n\n# Remote write configuration (optional)\n# remote_write:\n#   - url: \"https://prometheus-remote-write-endpoint\"\n#     basic_auth:\n#       username: \"username\"\n#       password: \"password\"\n\n# Storage configuration\nstorage:\n  tsdb:\n    retention.time: 30d\n    retention.size: 10GB\n    path: /prometheus/data\n\n# Web configuration\nweb:\n  console.libraries: /etc/prometheus/console_libraries\n  console.templates: /etc/prometheus/consoles\n  enable-lifecycle: true\n  enable-admin-api: true\n"